name: TWRP 16 Builder

on:
  workflow_dispatch:
    inputs:
      TWRP_MANIFEST_URL:
        description: "TWRP manifest url"
        required: true
        default: "https://github.com/TWRP-Test/platform_manifest_twrp_aosp"
      TWRP_MANIFEST_BRANCH:
        description: "TWRP branch"
        required: true
        default: "twrp-16.0"
      DEVICE_TREE_URL:
        description: "Device tree url"
        required: true
        default: "https://github.com/481627534/twrp_device_oplus_sm8475"
      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "twrp-16.0"
      DEVICE_PATH:
        description: "Device path device/"
        required: true
        default: "oplus/sm8475"
      DEVICE_NAME:
        description: "Device name"
        required: true
        default: "sm8475"
      LUNCH_TARGET:
        description: "lunch twrp_ (default same as device name)"
        required: false
        default: ""
      BUILD_PARTITION:
        description: "Build partition"
        required: true
        default: "recovery"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Show build info
      run: |
        if [ -n "${{ github.event.inputs.LUNCH_TARGET }}" ]; then
          echo "LUNCH_TARGET=${{ github.event.inputs.LUNCH_TARGET }}" >> "$GITHUB_ENV"
        else
          echo "LUNCH_TARGET=${{ github.event.inputs.DEVICE_NAME }}" >> "$GITHUB_ENV"
        fi
        {
          echo 'BUILD_INFO<<EOF'
          echo
          echo Manifest url: ${{ github.event.inputs.TWRP_MANIFEST_URL }}
          echo Manifest branch: ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }}
          echo Device tree url: ${{ github.event.inputs.DEVICE_TREE_URL }}
          echo Device tree branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
          echo Device path: ${{ github.event.inputs.DEVICE_PATH }}
          echo Device name: ${{ github.event.inputs.DEVICE_NAME }}
          echo Lunch target: ${{ github.event.inputs.LUNCH_TARGET }}
          echo Build target: ${{ github.event.inputs.BUILD_PARTITION }}.img
          echo Build date: `date`
          echo
          echo EOF
        } >> "$GITHUB_ENV"
        echo BUILD_DATE=`date +%F` >> "$GITHUB_ENV"
        echo "REPO_NAME=$(basename ${{ github.event.inputs.TWRP_MANIFEST_URL }})" >> "$GITHUB_ENV"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Setup swap
      # 🔴 已删除 easimon/maximize-build-space（2026-11-03 定案）。它在本机纯负收益：
      #    ① 先 `swapoff -a` + 删掉 runner 自带的健康 swapfile；
      #    ② 用 lvcreate 建 swap LV，底层是 loop 设备 → /pv.img 稀疏文件 → root 的 ext4
      #       （run #5 日志里 `Physical volume "/dev/loop0" successfully created` 已证实）。
      #    Linux 的 swap-on-loopfile 是已知的递归回收死锁场景：内存紧张时内核要回收页面，
      #    回收又必须给 loop 文件分配新块，而分配块本身又要内存 ⇒ 卡在 D 态、VM 直接消失。
      #    证据：run #4 52m、#6 50m、#7 46m 三次死在同一阶段，日志一个字都没留下。
      # 实测 slimhub 之后 root 可用 136 GB ⇒ 磁盘从来不是瓶颈，根本不需要"扩容"。
      # 结论：swap 只用 root ext4 上的普通 swapfile。
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        # 24G 不是拍脑袋：run #8 实测 soong_build 单进程 RSS 14.7 GB，
        # 15 GB 物理 + 8 GB swap 一起被打满，soong bootstrap 被 kill。
        # soong 分析阶段是单进程单线程，-j 对它无效，只能靠换页空间兜。
        sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        echo "=== swap（必须是 /swapfile，不能出现 /dev/mapper 或 loop）==="
        swapon --show
        free -h
        df -h /
        echo "=== 确认 swapfile 的底层不是 loop ==="
        findmnt -no SOURCE,FSTYPE / || true

    - name: Verify resources
      run: |
        echo "=== 全部挂载点（确认 /mnt 是 tmpfs 还是磁盘）==="
        df -hT
        echo "=== 内存 / swap ==="
        free -h
        swapon --show || echo "（无 swap）"
        echo "=== CPU ==="
        nproc
        echo "=== 关键目录 ==="
        echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
        du -sh "$GITHUB_WORKSPACE" 2>/dev/null || true

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true
        # 首轮没有缓存可用，开太大纯占磁盘；1G 足够命中高频头文件/小目标
        max-size: 1G

    - name: Tune kernel
      run: |
        # zram 不再开启：压缩数据驻留 RAM，15G 机器上只会加剧抖动（run #4 起已确认）。
        # AOSP 编译要大量 mmap，默认 vm.max_map_count=65530 偏小
        sudo sysctl -w vm.max_map_count=262144 || true
        # ⚠️ 这里 swappiness 要**调高**不是调低。soong_build 单进程要 14.7 GB，
        #    物理只有 15 GB，内核必须愿意把冷页面换出去给 soong 腾地方。
        #    swappiness=10 会让内核死守匿名页 → 直接 OOM kill，正是 run #8 的死法。
        sudo sysctl -w vm.swappiness=60 || true
        echo "max_map_count=$(cat /proc/sys/vm/max_map_count)"
        echo "=== 最终内存/swap 状态 ==="
        free -h
        swapon --show

    - name: Setup environment
      run: |
        export DEBIAN_FRONTEND=noninteractive
        # 不跑 apt upgrade：runner 上它会升级内核/驱动，耗时 2-3 分钟且可能引入新问题
        sudo apt-get update -qq || true
        sudo apt-get install -y repo || {
          echo "apt 装 repo 失败，改用官方脚本"
          mkdir -p ~/bin
          curl -fsSL --insecure https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
        }
        # ubuntu-latest 只有 python3，AOSP 某些脚本要 python
        sudo ln -sf /usr/bin/python3 /usr/bin/python || true
        git config --global user.name ${{ github.actor }}
        git config --global user.email ${{ github.actor }}@users.noreply.github.com
        echo "--- toolchain ---"
        python --version || true
        java -version || true
        repo --version 2>&1 | head -3 || true
        nproc; free -h | head -2; df -h / | tail -1

    - name: Sync source
      run: |
        repo init -u ${{ github.event.inputs.TWRP_MANIFEST_URL }} -b ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }} --depth=1
        (while true; do echo "Syncing source... $(date +%H:%M:%S) | / 可用 $(df -h / | tail -1 | awk '{print $4}')"; sleep 60; done) &
        TIP_PID=$!
        # 注意：原写法 `kill $TIP_PID && exit 0` 会把 repo sync 的失败吞掉（失败也 exit 0）
        if repo sync; then
          kill $TIP_PID 2>/dev/null || true
          echo "repo sync 完成，/ 剩余 $(df -h / | tail -1 | awk '{print $4}')"
        else
          kill $TIP_PID 2>/dev/null || true
          echo "::error::repo sync 失败"
          exit 1
        fi

        # 实测磁盘充足（slimhub 后 136 GB 可用），不删 .repo——删它要花 1~2 分钟还多一个失败点。
        # 只做一次空间体检，作为保险。
        echo "=== 同步后磁盘 ==="
        df -hT | head -8
        AVAIL=$(df -m "$GITHUB_WORKSPACE" | tail -1 | awk '{print $4}')
        echo "workspace 可用 ${AVAIL}MB"
        if [ "$AVAIL" -lt 25000 ]; then
          echo "::error::workspace 可用仅 ${AVAIL}MB (<25G)，编译 out 需要约 20G，提前退出"
          du -sh "$GITHUB_WORKSPACE"/* 2>/dev/null | sort -h | tail -15 || true
          exit 1
        fi

    - name: Setup device
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} device/${{ github.event.inputs.DEVICE_PATH }}

    # PGW110：TWRP 电量恒显 100% 的修复。
    # 根因：recovery 链接 android.hardware.health-V4-ndk.so，但 battery_utils.cpp 仍调
    # getCapacity()；Health AIDL V3+ 已把它改成固定返回 EX_UNSUPPORTED_OPERATION，
    # 于是落到「无电池设备」分支硬编码 100。补丁改为直接读内核 sysfs 节点。
    # 锚点找不到时脚本以非 0 退出，让这里显式失败（避免静默少打补丁）。
    - name: Patch recovery battery capacity (PGW110)
      run: |
        python3 device/${{ github.event.inputs.DEVICE_PATH }}/tools/patch_battery_capacity.py \
          bootable/recovery/recovery_utils/battery_utils.cpp

    # PGW110 v0.9：给 vold 的 DE key 解密链路加 stderr 日志。
    # 背景：TWRP 把 libvold 静态链接进 recovery 主进程，而 vold 用 LOG(INFO)
    # （libbase → logd socket），recovery 里没有 logd 在跑 ⇒ 这些日志全被丢掉，
    # /tmp/recovery.log 里只剩 Decrypt.cpp 那两行 printf。DE key 失败时因此
    # 看不到"卡在哪一步、keymaster 返回什么错误码"，只能靠猜。
    # 本脚本插入带 [volddbg] 标记的 fprintf(stderr, ...)，覆盖完整链路。
    # 锚点失配会 exit 1 —— 宁可编译前 1 分钟失败，也不要白编 50 分钟后刷机才发现没打上。
    - name: Patch vold debug logging (PGW110)
      run: |
        python3 device/${{ github.event.inputs.DEVICE_PATH }}/tools/patch_vold_debug.py .

    - name: Generate build info
      run: |
        echo -e "$BUILD_INFO" >> INFO.txt
        echo "Change log:" >> INFO.txt
        set +e
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
        if [ $? -eq 0 ]; then
          git log "$LAST_TAG"..HEAD --pretty=format:"- %h-%an: %s" >> INFO.txt
        else
          git log --pretty=format:"- %h-%an: %s" >> INFO.txt
        fi
        cat INFO.txt
      working-directory: device/${{ github.event.inputs.DEVICE_PATH }}

    - name: Build TWRP
      timeout-minutes: 300  # 5小时（GitHub 硬上限 6h）
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -o pipefail
        ulimit -c 0   # 不生成 core dump，省磁盘
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export CCACHE_DIR=.ccache
        export CCACHE_EXEC=$(command -v ccache)
        export CCACHE_MAXSIZE=1G
        export USE_CCACHE=1
        export LC_ALL=C

        # 日志外送脚本：runner 被强杀时 GitHub 的日志 blob 根本不会生成
        # （/actions/jobs/{id}/logs 返回 BlobNotFound），只能靠编译期间主动外送。
        # ⚠️ 不用 python 做 JSON 转义（上一版就是这里静默失败，comment 数 = 0），
        #    改用 jq（runner 自带），并把 HTTP 码打出来。
        if ! command -v jq >/dev/null 2>&1; then
          sudo apt-get install -y jq >/dev/null 2>&1 || true
        fi
        post_log() {
          local txt body
          txt=$(tail -c 4000 build.log 2>/dev/null || true)
          [ -n "$txt" ] || txt="(build.log 暂无内容)"
          body=$(printf '### build.log @ %s\n```\n%s\n```' "$(date +%H:%M:%S)" "$txt")
          if command -v jq >/dev/null 2>&1; then
            jq -n --arg b "$body" '{body:$b}' > /tmp/body.json
          else
            printf '%s' "$body" > /tmp/body.txt
            python3 -c "import json;print(json.dumps({'body':open('/tmp/body.txt',encoding='utf-8',errors='replace').read()}))" > /tmp/body.json || return 0
          fi
          local code
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/body.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" 2>/dev/null || echo "000")
          echo "[$(date +%H:%M:%S)] 日志外送 HTTP=${code} token_len=${#GH_TOKEN}"
          [ "$code" = "201" ] || head -c 300 /tmp/resp.json 2>/dev/null || true
          echo
        }

        echo "=== 编译前资源 ==="
        df -h / | tail -1
        free -h
        echo "token_len=${#GH_TOKEN} repo=${GITHUB_REPOSITORY} sha=${GITHUB_SHA}"

        # lunch 容错：AQ1601 的 README 写简写，TWRP-Test README 写 -bp2a-eng
        LT="${LUNCH_TARGET}"
        lunch twrp_${LT} || lunch twrp_${LT}-bp2a-eng || {
          echo "::error::lunch twrp_${LT} 与 twrp_${LT}-bp2a-eng 都失败"
          source build/envsetup.sh 2>/dev/null || true
          echo "--- 可用 lunch 组合 ---"
          print_lunch_menu 2>/dev/null | head -40 || true
          exit 1
        }

        JOBS=$(( $(nproc) / 2 ))
        [ $JOBS -lt 2 ] && JOBS=2
        echo "使用 $JOBS 个并行任务"

        # 看门狗：磁盘 < 2GB 或 内存可用 < 800MB 就主动杀编译并留证据
        # （前三次都是"VM 直接消失、日志一个字都没留下"，必须让失败变成"带日志退出"）
        (
          while sleep 30; do
            AVAIL=$(df -m / | tail -1 | awk '{print $4}')
            MEM=$(free -m | awk '/^Mem:/{print $7}')
            SWP=$(free -m | awk '/^Swap:/{print $3}')
            LAST=$(tail -1 build.log 2>/dev/null | cut -c1-150)
            LINE="[$(date +%H:%M:%S)] 心跳 | 磁盘 ${AVAIL}MB | 内存可用 ${MEM}MB | swap ${SWP}MB | 最后: ${LAST}"
            echo "$LINE"
            echo "$LINE" >> build.log 2>/dev/null || true
            if [ "$AVAIL" -lt 2048 ]; then
              echo "::error::磁盘可用仅 ${AVAIL}MB (<2GB)，主动中止编译，保留日志"
              dmesg | tail -20 || true
              pkill -9 -f ninja 2>/dev/null || true
              pkill -9 -f soong_ui 2>/dev/null || true
              break
            fi
            # 阈值 400MB 而不是 800MB：soong_build 本来就会把物理内存吃到很低、
            # 靠 swap 撑住，800MB 会误杀一个正常工作的 soong 分析阶段。
            if [ "$MEM" -lt 400 ]; then
              echo "::error::内存可用仅 ${MEM}MB (<800MB)，主动中止编译，保留日志"
              echo "--- dmesg 最后 30 行（找 OOM killer）---"
              dmesg | tail -30 || true
              echo "--- 内存占用前 10 的进程 ---"
              ps -eo pid,rss,comm --sort=-rss | head -11 || true
              pkill -9 -f ninja 2>/dev/null || true
              pkill -9 -f soong_ui 2>/dev/null || true
              break
            fi
          done
        ) &
        HEARTBEAT_PID=$!

        # 日志外送（每 3 分钟一条 commit comment）
        (
          while sleep 180; do
            post_log
          done
        ) &
        LOG_PID=$!

        # 先发一条，确认通道可用（不等 3 分钟）
        post_log

        m -j$JOBS ${{ github.event.inputs.BUILD_PARTITION }}image 2>&1 | tee build.log
        RC=${PIPESTATUS[0]}

        kill $HEARTBEAT_PID $LOG_PID 2>/dev/null || true
        post_log
        echo "=== m 退出码: $RC ==="
        echo "=== 编译后资源 ==="
        df -h / | tail -1
        free -h

        if [ "$RC" -ne 0 ]; then
          echo "::error::m 编译失败，退出码 $RC"
          echo "--- build.log 末尾 80 行 ---"
          tail -80 build.log || true
          exit $RC
        fi

        mv out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_PARTITION }}.img out/target/product/${{ github.event.inputs.DEVICE_NAME }}/TWRP-3.7.1-16-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}.img

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        if-no-files-found: ignore
        retention-days: 3

    - name: Size gate (PGW110)
      run: |
        # ⚠️ 不能硬编码 recovery.img：Build TWRP 末尾已经把它 mv 成
        #    TWRP-3.7.1-16-<dev>-<date>.img。run #9 就栽在这——编译 01:29:11 成功、
        #    m 退出码 0，结果这一步 stat 原名失败 exit 1，整轮白判失败。
        #    用 glob 兜住两种名字。
        DIR="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        IMG=$(ls -1 "$DIR"/TWRP-*.img "$DIR"/recovery.img 2>/dev/null | head -1)
        if [ -z "$IMG" ] || [ ! -f "$IMG" ]; then
          echo "::error::找不到产物 img"
          ls -lh "$DIR" | head -30 || true
          exit 1
        fi
        SZ=$(stat -c%s "$IMG")
        echo "产物 = $IMG"
        echo "大小 = $SZ B   (分区上限 104857600 B)"
        if [ "$SZ" -gt 104857600 ]; then
          echo "::error::超出 recovery_a/recovery_b 分区 100 MiB，刷不进去"
          exit 1
        fi
        echo "余量 = $(( 104857600 - SZ )) B"
        echo "sha256 = $(sha256sum "$IMG" | cut -d' ' -f1)"

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: | 
          out/target/product/${{ github.event.inputs.DEVICE_NAME }}/TWRP-3.7.1-16-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}.img
        name: TWRP-3.7.1-16-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
        tag_name: ${{ env.BUILD_DATE }}-${{ github.run_id }}
        body_path: device/${{ github.event.inputs.DEVICE_PATH }}/INFO.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
